services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.2
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  apm-server:
    image: docker.elastic.co/apm/apm-server:9.4.2
    command:
      - "-e"
      - "--strict.perms=false"
      - "-E"
      - "apm-server.host=0.0.0.0:8200"
      - "-E"
      - 'output.elasticsearch.hosts=["http://elasticsearch:9200"]'
      - "-E"
      - "apm-server.auth.anonymous.enabled=true"
    ports:
      - "8200:8200"
    depends_on:
      elasticsearch:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: observability
      POSTGRES_USER: observability
      POSTGRES_PASSWORD: observability
    ports:
      - "5432:5432"


  kafka:
    image: apache/kafka:4.1.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  backend-service:
    build:
      context: .
      args:
        JAR_FILE: backend-service/build/libs/backend-service-0.0.1-SNAPSHOT.jar
    environment:
      - SERVER_PORT=8081
      - OTEL_SERVICE_NAME=backend-service
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://apm-server:8200/v1/traces
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://apm-server:8200/v1/metrics
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=http://apm-server:8200/v1/logs
      - OTEL_INSTRUMENTATION_LOGS_MDC_ENABLED=true
      - OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/observability
      - SPRING_DATASOURCE_USERNAME=observability
      - SPRING_DATASOURCE_PASSWORD=observability
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8081:8081"
    depends_on:
      - kafka
      - postgres
      - apm-server

  frontend-service:
    build:
      context: .
      args:
        JAR_FILE: frontend-service/build/libs/frontend-service-0.0.1-SNAPSHOT.jar
    environment:
      - SERVER_PORT=8080
      - BACKEND_BASE_URL=http://backend-service:8081
      - OTEL_SERVICE_NAME=frontend-service
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://apm-server:8200/v1/traces
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://apm-server:8200/v1/metrics
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=http://apm-server:8200/v1/logs
      - OTEL_INSTRUMENTATION_LOGS_MDC_ENABLED=true
      - OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED=true
    ports:
      - "8080:8080"
    depends_on:
      - backend-service
      - apm-server